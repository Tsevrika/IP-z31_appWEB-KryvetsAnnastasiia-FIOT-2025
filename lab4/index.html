<script>
let time = prompt("Введіть час у форматі год:хв (наприклад 10:30):");

console.log(`Користувач ввів час: ${time}`);

if (!time || !time.includes(":")) {
  alert("Некоректний формат");
} else {
  let [hour, minute] = time.split(":").map(Number);

  if (
    isNaN(hour) ||
    isNaN(minute) ||
    hour < 0 ||
    hour > 23 ||
    minute < 0 ||
    minute > 59
  ) {
    alert("Некоректні значення часу");
    console.log(`Некоректні значення час`);

  } else {
    if (minute <= 15) {
      alert("Перша чверть години");
      console.log(`Перша чверть години`);
    }
    else if (minute <= 30) {
      alert("Друга чверть години");
      console.log(`Друга чверть години`);
    }
    else if (minute <= 45) 
    {
      alert("Третя чверть години");
      console.log(`Третя чверть години`);
    }
    else 
    {
      alert("Четверта чверть години");
      console.log(`Четверта чверть години`);
    }
  }
}
</script>

<script>
function makeArray(firstArray, secondArray, maxLength) {
  const newArray = [...firstArray, ...secondArray];

  if (newArray.length > maxLength) {
    return newArray.slice(0, maxLength);
  }

  return newArray;
}

let firstInput = prompt("Завдання 6 : Введіть елементи першого масиву через кому:");
console.log(`Користувач ввів: ${firstInput}`);
let secondInput = prompt("Завдання 6 : Введіть елементи другого масиву через кому:");
console.log(`Користувач ввів: ${secondInput}`);
let maxLen = Number(prompt("Завдання 6 : Введіть максимальну довжину нового масиву:"));
console.log(`Користувач ввів: ${maxLen}`);

let firstArray = firstInput
  .split(",")
  .map(item => item.trim())
  .filter(item => item !== "");

let secondArray = secondInput
  .split(",")
  .map(item => item.trim())
  .filter(item => item !== "");

const merged = makeArray(firstArray, secondArray, maxLen);

console.log("Перший масив:", firstArray);
console.log("Другий масив:", secondArray);
console.log("Новий масив:", merged);
alert(`Новий масив: ${merged.join(", ")}`);
</script>

<h2>Завдання 7</h2>
<script>
function createArray(size) {
  const arr = [];
  for (let i = 0; i < size; i++) {
    arr.push(Number(prompt(`Введіть елемент #${i + 1}:`)));
  }
  return arr;
}

function findMinCommonElement(arr1, arr2) {
  const common = arr1.filter(x => arr2.includes(x));

  if (common.length === 0) return null;

  return Math.min(...common);
}

let n1 = Number(prompt("Введіть кількість елементів першого масиву:"));
let n2 = Number(prompt("Введіть кількість елементів другого масиву:"));

let array1 = createArray(n1);
let array2 = createArray(n2);

console.log("Перший масив:", array1);
console.log("Другий масив:", array2);

let minCommon = findMinCommonElement(array1, array2);

if (minCommon === null) {
  alert("Немає спільних елементів.");
  console.log("Немає спільних елементів.");
} else {
  alert(`Найменший спільний елемент: ${minCommon}`);
  console.log(`Найменший спільний елемент: ${minCommon}`);
}

function bubbleSort(arr) {
  let sortedArr = [...arr];
  let n = sortedArr.length;

  for (let i = 0; i < n - 1; i++) {
    for (let j = 0; j < n - i - 1; j++) {
      if (sortedArr[j] > sortedArr[j + 1]) {
        let temp = sortedArr[j];
        sortedArr[j] = sortedArr[j + 1];
        sortedArr[j + 1] = temp;
      }
    }
  }
  return sortedArr;
}

let sortedArray1 = bubbleSort(array1);
let sortedArray2 = bubbleSort(array2);

console.log("Перший масив ДО сортування:", array1);
console.log("Перший масив ПІСЛЯ сортування:", sortedArray1);

console.log("Другий масив ДО сортування:", array2);
console.log("Другий масив ПІСЛЯ сортування:", sortedArray2);


alert(
  "Перший масив ДО сортування:\n" +
  array1.join(", ") +
  "\n\nПерший масив ПІСЛЯ сортування:\n" +
  sortedArray1.join(", ")
);
alert(
  "Другий масив ДО сортування:\n" +
  array2.join(", ") +
  "\n\nДругий масив ПІСЛЯ сортування:\n" +
  sortedArray2.join(", ")
);
</script>

<label>Введіть дату і час будильника:</label><br>
<input type="datetime-local" id="alarmTime"><br><br>

<button onclick="setAlarm()">Увімкнути будильник</button>
<button onclick="clearAlarm()">Вимкнути будильник</button>

<p id="status" style="font-size:18px; color:blue;"></p>

<script>
let alarmTime = null;
let alarmActive = false;
let timer = null;

function setAlarm() {
    let input = document.getElementById("alarmTime").value;

    if (!input) {
        alert("Введіть дату і час!");
        return;
    }

    alarmTime = new Date(input);
    alarmActive = true;

    document.getElementById("status").textContent =
        "Будильник встановлено на: " + alarmTime.toLocaleString();
        console.log(`Будильник встановлено на: ${alarmTime.toLocaleString()}`);

    if (timer) clearInterval(timer);

    timer = setInterval(checkAlarm, 1000);
}

function checkAlarm() {
    if (!alarmActive) return;

    let now = new Date();

    if (now >= alarmTime) {
        alert("Будильник! Час настав!");
        document.getElementById("status").textContent =
            "Будильник спрацював: " + now.toLocaleString();
            console.log(`Будильник спрацював: ${now.toLocaleString()}`);
        clearAlarm();
    }
}

function clearAlarm() {
    alarmActive = false;
    alarmTime = null;
    document.getElementById("status").textContent = "Будильник вимкнено";
    if (timer) clearInterval(timer);
}
</script>
