<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Image Search</title>

    <style>
      .loader {
        border: 6px solid #f3f3f3;
        border-top: 6px solid #3498db;
        border-radius: 50%;
        width: 45px;
        height: 45px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }
      .hidden {
        display: none;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }

      .gallery {
        margin-top: 20px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        list-style: none;
        padding: 0;
      }

      .photo-card {
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        background: #fff;
      }

      .photo-card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        display: block;
      }

      .info {
        padding: 10px;
        font-size: 14px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px 10px;
      }
    </style>

    <link 
      rel="stylesheet"
      href="https://unpkg.com/simplelightbox@2.14.1/dist/simple-lightbox.min.css"
    />
  </head>

  <body>

    <form class="search-form" id="search-form">
      <input 
        type="text" 
        name="query" 
        autocomplete="off" 
        placeholder="Search images..." 
      />
      <button type="submit">Search</button>
    </form>

    <div id="loader" class="loader hidden"></div>

    <ul class="gallery"></ul>

    <script src="https://unpkg.com/simplelightbox@2.14.1/dist/simple-lightbox.min.js"></script>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
